[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true

# ── Externalized libraries (EIP-170 size split) ────────────────────────────────
#
# The following library functions are `public`, so they are DEPLOYED SEPARATELY and
# linked into their consumers via DELEGATECALL (not inlined):
#   - VaultMath        (src/libraries/VaultMath.sol)
#   - TickMath         (src/libraries/UniswapV3Math.sol)
#   - LiquidityAmounts (src/libraries/UniswapV3Math.sol)
# Consumers that require linking: RebalancerVaultUpgradeable, VaultLens, Strategy.
#
# `forge test` and `forge script --broadcast` auto-deploy + link these libraries, so
# no config is required for a fresh deploy. For REPRODUCIBLE upgrades (reuse the same
# on-chain library bytecode instead of redeploying) and for explorer verification,
# pin the addresses emitted by the first Deploy broadcast here, e.g.:
#
# libraries = [
#   "src/libraries/VaultMath.sol:VaultMath:0x...",
#   "src/libraries/UniswapV3Math.sol:TickMath:0x...",
#   "src/libraries/UniswapV3Math.sol:LiquidityAmounts:0x...",
# ]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# ── Invariant campaign settings ────────────────────────────────────────────────
#
# Development profile: fast feedback, medium depth.
# Run with: forge test --match-contract InvariantTest
[profile.default.invariant]
runs  = 256    # sequences to generate
depth = 512    # calls per sequence
# fail_on_revert is intentionally false during development.
# Once handler revert rate is confirmed below ~10%, promote to the
# "ci" profile below and enable fail_on_revert = true.
fail_on_revert = false

# ── CI / long campaign profile ─────────────────────────────────────────────────
#
# Run with: FOUNDRY_PROFILE=ci forge test --match-contract InvariantTest
[profile.ci]
src            = "src"
out            = "out"
libs           = ["lib"]
optimizer      = true
optimizer_runs = 200
via_ir         = true

[profile.ci.invariant]
runs           = 1000  # high run count for thorough state-space exploration
depth          = 1000  # long call sequences to find deep invariant violations
fail_on_revert = true  # target state: no handler function should revert


